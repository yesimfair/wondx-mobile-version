<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Wondx mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tokens: same names and values as the Wondx variable collection in Figma (Light | Dark). */
:root{color-scheme:light;
  --surface-page:#FFFFFF;--surface-default:#FFFFFF;--surface-raised:#FFFFFF;--surface-sunken:rgba(32,32,32,.06);
  --border-default:rgba(32,32,32,.08);--border-strong:rgba(32,32,32,.16);
  --text-primary:#202020;--text-secondary:#6C6C6C;--text-disabled:#A3A3A3;--text-accent:#3D38E9;--text-on-ink:#F8F8F8;--text-on-media:#F8F8F8;
  --action-primary:#202020;--action-accent:#3D38E9;--text-on-accent:#FFFFFF;--overlay-on-accent:rgba(255,255,255,.12);
  --status-danger:#D03B3B;--status-success:#12B981;--status-success-text:#005B3C;--tint-success:rgba(18,185,129,.12);--tint-accent:rgba(61,56,233,.12);--surface-selected:#FFFFFF;--tint-danger:rgba(208,59,59,.12);--text-danger:#B3232B;--action-danger:#BF0014;--text-on-danger:#F8F8F8;
  --overlay-on-surface:rgba(0,0,0,.04);--overlay-on-primary:rgba(255,255,255,.08);--overlay-on-media:rgba(32,32,32,.48);
  --overlay-scrim:rgba(0,0,0,.4);
  --focus-ring:#202020;
  --stage:#F1F1F1; /* surface/sunken flattened over surface/page, for the area around the phone */
  --display:'Bricolage Grotesque',Geist,system-ui,sans-serif;--body:Geist,system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --surface-page:#141414;--surface-default:#202020;--surface-raised:#262626;--surface-sunken:rgba(255,255,255,.06);
  --border-default:rgba(255,255,255,.10);--border-strong:rgba(255,255,255,.20);
  --text-primary:#F8F8F8;--text-secondary:#9A9A9A;--text-disabled:#6A6A6A;--text-accent:#A5A3F8;--text-on-ink:#202020;
  --action-primary:#F8F8F8;--status-danger:#E05B5B;--status-success:#2ACB96;--status-success-text:#8FE9C6;--tint-success:rgba(42,203,150,.16);--tint-accent:rgba(165,163,248,.16);--surface-selected:#2E2E2E;--tint-danger:rgba(224,91,91,.16);--text-danger:#F08A8A;--action-danger:#BF0014;--text-on-danger:#F8F8F8;
  --overlay-on-surface:rgba(255,255,255,.08);--overlay-on-primary:rgba(0,0,0,.08);--focus-ring:#F8F8F8;--stage:#0B0B0B}}
:root[data-theme="dark"]{color-scheme:dark;
  --surface-page:#141414;--surface-default:#202020;--surface-raised:#262626;--surface-sunken:rgba(255,255,255,.06);
  --border-default:rgba(255,255,255,.10);--border-strong:rgba(255,255,255,.20);
  --text-primary:#F8F8F8;--text-secondary:#9A9A9A;--text-disabled:#6A6A6A;--text-accent:#A5A3F8;--text-on-ink:#202020;
  --action-primary:#F8F8F8;--status-danger:#E05B5B;--status-success:#2ACB96;--status-success-text:#8FE9C6;--tint-success:rgba(42,203,150,.16);--tint-accent:rgba(165,163,248,.16);--surface-selected:#2E2E2E;--tint-danger:rgba(224,91,91,.16);--text-danger:#F08A8A;--action-danger:#BF0014;--text-on-danger:#F8F8F8;
  --overlay-on-surface:rgba(255,255,255,.08);--overlay-on-primary:rgba(0,0,0,.08);--focus-ring:#F8F8F8;--stage:#0B0B0B}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--text-primary);font:400 16px/24px var(--body);-webkit-font-smoothing:antialiased;text-wrap:pretty}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.ic{width:16px;height:16px;fill:currentColor;flex:none;display:block}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.clamp1{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;white-space:nowrap;clip-path:inset(50%)}

/* the phone: a 390 × 844 screen on a computer, the whole screen on a phone */
.stage{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.device{position:relative;width:390px;height:844px;border-radius:40px;overflow:hidden;background:var(--surface-page);box-shadow:0 0 0 1px var(--border-default),0 24px 64px rgba(0,0,0,.16)}
@media (max-width:600px){
  .stage{display:block;padding:0;min-height:0}
  .device{width:100%;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border-radius:0;box-shadow:none}
}
.screen{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;scroll-padding-top:56px;scroll-padding-bottom:64px}

/* top bar (56): logo, search, bell; More only on your profile */
.mtop{position:sticky;top:0;z-index:20;flex:none;height:56px;display:flex;align-items:center;gap:4px;padding:0 12px 0 16px;background:var(--surface-page);border-bottom:1px solid var(--border-default)}
.mtop .home{display:block;margin-right:auto;border-radius:8px}
.logo{height:24px;width:auto;fill:var(--text-primary);flex:none;display:block}
.ib{position:relative;width:40px;height:40px;padding:0;border:0;border-radius:999px;background:transparent;display:grid;place-items:center;color:var(--text-primary);flex:none}
.ib .ic{width:24px;height:24px}
.ib:hover{background:var(--overlay-on-surface)}
.ib.search{background:var(--surface-sunken)}
.ib.search .ic{width:20px;height:20px}
.ib.dotted .ic{-webkit-mask:radial-gradient(circle at 18px 6px,transparent 6px,#000 6.5px);mask:radial-gradient(circle at 18px 6px,transparent 6px,#000 6.5px)}
.ib .dot{position:absolute;left:22px;top:10px;width:8px;height:8px;border-radius:999px;background:var(--status-danger)}

.mtop .btn{flex:none;text-decoration:none}
.mtop .btn.ghost{margin-left:4px}
.btn.s36{height:36px;padding:0 12px;font:500 14px/20px var(--body)}
.btn.ghost{background:transparent;color:var(--text-primary)}
.btn.ghost:hover{background:var(--overlay-on-surface)}
.btn.primary:hover{box-shadow:inset 0 0 0 999px var(--overlay-on-primary)}
.mbar.three{grid-template-columns:repeat(3,minmax(0,1fr))}

/* page body */
.mmain{flex:1 0 auto;padding:0 16px 24px}
.mmain:focus{outline:none}
.l1{display:flex;align-items:flex-end;gap:24px;height:48px;margin:0 -16px;padding:0 16px;border-bottom:1px solid var(--border-default);overflow-x:auto;scrollbar-width:none}
.l1::-webkit-scrollbar{display:none}
.l1 a{flex:none;height:36px;padding:0 0 12px;font:400 16px/24px var(--body);color:var(--text-secondary);text-decoration:none;white-space:nowrap}
.l1 a[aria-current="page"]{color:var(--text-primary);box-shadow:inset 0 -2px 0 var(--text-primary)}
.l1 .sep{flex:none;align-self:center;width:1px;height:20px;margin-top:8px;background:var(--border-strong)}
.l2{margin:16px -16px}
.tags{display:flex;gap:8px;padding:0 16px;overflow-x:auto;scrollbar-width:none;scroll-padding-inline-start:136px}
.tags::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--border-strong);background:transparent;font:400 14px/20px var(--body);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.chip:hover{background:var(--overlay-on-surface)}
.chip.tool{position:sticky;left:0;z-index:1;background:var(--surface-page);box-shadow:16px 0 16px var(--surface-page),-28px 0 0 12px var(--surface-page)}
.chip.on{background:var(--action-primary);border-color:transparent;color:var(--text-on-ink)}
.chip.clr-chip{background:var(--surface-sunken);border-color:transparent}
.chip .ic{width:16px;height:16px}
.mas{display:flex;gap:12px;align-items:flex-start}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.post{display:flex;flex-direction:column;gap:8px;min-width:0}
.th{position:relative;border-radius:12px;overflow:hidden}
.th-link{position:absolute;inset:0;border-radius:12px}
.th-link:focus-visible{outline-offset:-2px}
.save{position:absolute;top:8px;right:8px;width:32px;height:32px;padding:0;border:0;border-radius:12px;background:var(--overlay-on-media);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--text-on-media);display:grid;place-items:center}
.meta{display:flex;align-items:flex-start;gap:8px}
.meta .t{flex:1;min-width:0;display:flex;flex-direction:column}
.meta .t b{font:500 14px/20px var(--body)}
.by{width:fit-content;max-width:100%;margin:-4px 0;font:400 13px/24px var(--body);color:var(--text-secondary);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.like{flex:none;height:24px;margin-right:-4px;padding:0 4px;border:0;border-radius:999px;background:transparent;display:inline-flex;align-items:center;gap:4px;color:var(--text-secondary);font:400 13px/16px var(--body);font-variant-numeric:tabular-nums}

/* page heads (Explore, Library): display/32 + a lede */
.phead{padding:24px 0 16px}
.ph-title{margin:0;font:700 32px/36px var(--display);letter-spacing:-.01em}
.lede{margin:8px 0 0;font:400 14px/20px var(--body);color:var(--text-secondary)}
.ptitle{margin:0 auto 0 4px;font:500 20px/24px var(--body)}
.mtop.page{padding-left:8px}
.lnk{color:var(--text-accent);text-decoration:none;font:500 14px/20px var(--body);display:inline-flex;align-items:center;gap:4px;min-height:24px}
.btn.outlined{background:transparent;color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--border-strong);text-decoration:none}
.btn.outlined:hover{background:var(--overlay-on-surface)}
.btn.full{width:100%}

/* Explore sections */
.xsec{margin-top:32px;display:flex;flex-direction:column;gap:12px}
.phead + .xsec{margin-top:8px}
.sec-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.sec-hd h2{margin:0;font:500 20px/24px var(--body)}
.sec-hd p{margin:4px 0 0;font:400 14px/20px var(--body);color:var(--text-secondary)}
.hrow{list-style:none;display:flex;gap:12px;margin:0 -16px;padding:0 16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.hrow > *{scroll-snap-align:start}
.hrow.chips{gap:8px}
.cats li{display:flex;flex-direction:column;gap:8px;min-width:0}
.cv.cat{aspect-ratio:3/2}
.cn{font:500 14px/20px var(--body)}
.g2{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
.xcard{display:flex;flex-direction:column;gap:8px;min-width:0}
.xcard .t{display:flex;flex-direction:column;min-width:0}
.xcard .t b{font:500 14px/20px var(--body)}
.xcard q{text-wrap:balance;margin-top:4px;font:400 13px/20px var(--body);color:var(--text-secondary);quotes:none}
.rk{position:absolute;top:8px;left:8px;min-width:24px;height:24px;padding:0 8px;border-radius:999px;background:var(--overlay-on-media);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--text-on-media);display:inline-flex;align-items:center;justify-content:center;font:500 13px/16px var(--body);font-variant-numeric:tabular-nums;pointer-events:none}
.rise .xcard{flex:none}
.jrows{display:flex;flex-direction:column;gap:16px}
.jrow{display:flex;gap:12px;align-items:flex-start}
.jrow .xcard{flex-basis:0;flex-shrink:1}
.wrap-chips{display:flex;flex-wrap:wrap;gap:8px}
.sec-t{display:flex;align-items:center;gap:4px}
.hlp{width:24px;height:24px;padding:0;border:0;border-radius:999px;background:transparent;display:grid;place-items:center;color:var(--text-secondary)}
.hlp .ic{width:20px;height:20px}
.see{gap:4px}
.see .ic{width:16px;height:16px}
.xcard.big{margin-bottom:4px}
.pcs .coll{width:auto}
.pcs .cv{aspect-ratio:1/1}
.coll .t{display:flex;flex-direction:column;min-width:0}
.coll .t b{font:500 14px/20px var(--body);display:flex;align-items:center;gap:4px}
.coll .t b .lk{width:16px;height:16px;color:var(--text-secondary)}
.xfoot{margin-top:32px;display:flex;justify-content:center}

/* Library */
.utabs{display:flex;gap:24px;height:48px;align-items:flex-end;margin:0 -16px 16px;padding:0 16px;border-bottom:1px solid var(--border-default);overflow-x:auto;scrollbar-width:none}
.utabs::-webkit-scrollbar{display:none}
.utabs button{flex:none;height:36px;padding:0 0 12px;border:0;background:transparent;font:400 16px/24px var(--body);color:var(--text-secondary);white-space:nowrap}
.utabs button span{color:var(--text-secondary);font-variant-numeric:tabular-nums}
.utabs button[aria-selected="true"]{color:var(--text-primary);box-shadow:inset 0 -2px 0 var(--text-primary)}
.lsearch{height:44px;margin-bottom:16px;border-radius:12px;background:var(--surface-sunken);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--text-secondary)}
.lsearch input{flex:1;min-width:0;height:100%;padding:0;border:0;background:transparent;font:400 16px/24px var(--body);color:var(--text-primary);outline:none}
.lsearch input::placeholder{color:var(--text-secondary)}
.lsearch:focus-within{box-shadow:0 0 0 2px var(--focus-ring)}
.lcols .coll{width:auto}
.lcols .cv{aspect-ratio:1/1}
.lcols .by{white-space:normal;margin:0;line-height:20px;text-wrap:balance}
.cv i.empty{background:var(--surface-sunken)}
.newc{width:100%;padding:0;aspect-ratio:1/1;border-radius:12px;border:1px dashed var(--border-strong);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:500 14px/20px var(--body);color:var(--text-primary)}
.newc .ic{width:24px;height:24px}
.newc:hover{background:var(--overlay-on-surface)}
.dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dl li{display:flex;align-items:center;gap:12px;padding:8px 0}
.dl li + li{border-top:1px solid var(--border-default)}
.dth{flex:none;width:48px;height:64px;border-radius:8px}
.dl .t{flex:1;min-width:0;display:flex;flex-direction:column}
.dl .t b{font:500 14px/20px var(--body)}
.dl .by{margin:0;line-height:20px}

/* You / profile */
.mmain.pf{padding-top:0}
.pf-banner{height:128px;margin:0 -16px;}
.pf-top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:-40px}
.pf-av{width:80px;height:80px;border-radius:999px;box-shadow:0 0 0 4px var(--surface-page);flex:none}
.pf-av[data-me]{background:radial-gradient(circle at 50% 38%,#f3d2b8 0 22%,transparent 23%),radial-gradient(ellipse at 50% 100%,#3a2f5c 0 46%,transparent 47%),linear-gradient(135deg,#8f7ae8,#e8926f)}
.pf-act{display:flex;gap:8px;align-items:center}
.ib.ol{width:36px;height:36px;box-shadow:inset 0 0 0 1px var(--border-strong)}
.ib.ol .ic{width:20px;height:20px}
.pf-id{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.pf-name{margin:0;font:700 32px/36px var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.vf{color:var(--text-accent);display:inline-flex}
.vf .ic{width:24px;height:24px}
.pf-handle{display:flex;align-items:center;gap:8px;font:400 14px/20px var(--body);color:var(--text-secondary)}
.bdg{display:inline-flex}
.bdg svg{width:20px;height:20px;display:block}
.pf-counts{margin:0;display:flex;flex-wrap:wrap;gap:4px 16px;font:400 14px/20px var(--body);color:var(--text-secondary)}
.pf-counts a{text-decoration:none;min-height:24px;display:inline-flex;align-items:center;gap:4px}
.pf-counts span{min-height:24px;display:inline-flex;align-items:center;gap:4px}
.pf-counts b{font-weight:500;color:var(--text-primary);font-variant-numeric:tabular-nums}
.pf-bio{margin:0;font:400 14px/20px var(--body)}
.pf-meta{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 16px;font:400 13px/20px var(--body);color:var(--text-secondary)}
.pf-meta li{display:inline-flex;align-items:center;gap:4px}
.short{margin:16px -16px 8px}
.short ul{list-style:none;margin:0;padding:0 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.short ul::-webkit-scrollbar{display:none}
.short .chip{text-decoration:none;color:var(--text-primary)}
.short .chip svg{width:16px;height:16px}
.short .chip .cn{font:500 13px/16px var(--body);color:var(--text-secondary)}
/* one height for every panel, so switching panels doesn't make the sheet jump */
#ssheet{height:512px}
.sbody{padding:8px 24px 24px}
.ccard{display:flex;flex-direction:column;gap:16px}
.cc-hd h3{margin:0;font:500 20px/24px var(--body)}
.cc-hd p{margin:4px 0 0;font:400 14px/20px var(--body);color:var(--text-secondary)}
.psel{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface-sunken)}
.psel button{flex:1 1 auto;height:32px;min-width:40px;padding:0 8px;border:0;border-radius:999px;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--text-secondary);font:500 13px/16px var(--body);white-space:nowrap}
.psel button .ic{width:16px;height:16px}
.psel button[aria-selected="true"]{flex:3 1 auto;background:var(--surface-raised);color:var(--text-primary);box-shadow:0 0 0 1px var(--border-default)}
.pbody{display:flex;flex-direction:column;gap:12px}
.ps-row{display:flex;flex-wrap:wrap;gap:8px 16px;font:500 14px/20px var(--body)}
.ps-row > span{display:inline-flex;align-items:center;gap:4px;min-height:24px}
.ps-row .ic{width:16px;height:16px}
.hm{display:flex;gap:8px}
.hm-days{flex:none;display:grid;grid-template-rows:16px repeat(7,12px);row-gap:4px;font:400 13px/12px var(--body);color:var(--text-secondary)}
.hm-days span:first-child{height:16px}
.hm-scroll{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;border-radius:4px}
.hm-scroll::-webkit-scrollbar{display:none}
.hm-months{display:grid;grid-template-columns:repeat(30,12px);column-gap:4px;height:16px;margin-bottom:4px;font:400 13px/16px var(--body);color:var(--text-secondary);width:max-content}
.hm-months span{white-space:nowrap;overflow:visible}
.hm-grid{display:grid;grid-template-columns:repeat(30,12px);grid-template-rows:repeat(7,12px);gap:4px;width:max-content}
.hm-grid i,.lg i{display:block;width:12px;height:12px;border-radius:4px}
.h0{background:var(--surface-sunken)}
.h1{background:color-mix(in srgb,var(--action-accent) 20%,transparent)}
.h2{background:color-mix(in srgb,var(--action-accent) 40%,transparent)}
.h3{background:color-mix(in srgb,var(--action-accent) 60%,transparent)}
.h4{background:color-mix(in srgb,var(--action-accent) 80%,transparent)}
.h5{background:var(--action-accent)}
.hm-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.lg{display:inline-flex;align-items:center;gap:4px;font:400 13px/16px var(--body);color:var(--text-secondary)}
.links{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.links a{display:flex;align-items:center;gap:8px;min-height:48px;padding:8px;border-radius:12px;background:var(--surface-sunken);text-decoration:none}
.lg-b{flex:none;width:32px;height:32px;border-radius:8px;background:var(--surface-raised);display:grid;place-items:center}
.lg-b .ic{width:16px;height:16px}
.links .t{min-width:0;display:flex;flex-direction:column}
.links .t b{font:500 14px/20px var(--body)}
.links .t span{font:400 13px/16px var(--body);color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.about-t p{margin:0 0 8px;font:400 14px/20px var(--body)}
.about-t p:last-child{margin:0}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ft{display:block;aspect-ratio:3/4;border-radius:12px}
.gb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}

.uin:focus{box-shadow:0 0 0 2px var(--focus-ring)}
.uhelp{margin:0;font:400 13px/20px var(--body);color:var(--text-secondary)}
.tagbox{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:44px;padding:4px 8px;border-radius:12px;background:var(--surface-sunken)}
.tagbox:focus-within{box-shadow:0 0 0 2px var(--focus-ring)}
.tg{height:32px;padding:0 4px 0 12px;border-radius:999px;background:var(--surface-page);display:inline-flex;align-items:center;gap:4px;font:400 14px/20px var(--body)}
.tg button{width:24px;height:24px;padding:0;border:0;border-radius:999px;background:transparent;display:grid;place-items:center;color:var(--text-secondary)}
.tg .ic{width:14px;height:14px}
.tagbox input{flex:1 0 100%;min-width:0;height:32px;padding:0 4px;border:0;background:transparent;font:400 16px/24px var(--body);color:var(--text-primary);outline:none}
.tagbox input::placeholder,.uin::placeholder{color:var(--text-secondary)}
.sugt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:400 13px/16px var(--body);color:var(--text-secondary)}
.sugt .chip{height:32px;padding:0 12px;color:var(--text-primary)}
.utog{display:flex;align-items:center;gap:16px;margin-top:16px}
.utog .t{flex:1;min-width:0;display:flex;flex-direction:column}
.utog b{font:500 14px/20px var(--body)}
.utog .t span{font:400 13px/20px var(--body);color:var(--text-secondary)}
.adds{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.adds .chip,.chip.plus{height:36px;color:var(--text-primary)}
.chip.plus{margin-top:8px;align-self:flex-start}
.ufooter{margin-top:24px;padding-top:16px;border-top:1px solid var(--border-default);display:flex;align-items:center;justify-content:space-between;gap:8px;font:400 13px/16px var(--body);color:var(--text-secondary)}
.ufooter > div{display:flex;gap:8px}
.ucard2{margin-top:16px;padding:12px;border-radius:16px;border:1px solid var(--border-default);display:flex;flex-direction:column;gap:12px}
.ucard2 h2{margin:0;font:500 14px/20px var(--body)}
.uc-hd{display:flex;align-items:center;justify-content:space-between}
.scpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.scpick button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:8px;border-radius:12px;border:0;box-shadow:inset 0 0 0 1px var(--border-default);background:transparent;text-align:left;min-width:0}
.scpick button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--text-primary)}
.scpick b{font:500 13px/16px var(--body)}
.scpick span{font:400 13px/16px var(--body);color:var(--text-secondary)}
.scpick i{display:block;width:100%;height:32px;border-radius:8px;background:var(--surface-sunken);margin-bottom:4px}
.unote{display:flex;gap:8px;margin:12px 0 0;font:400 13px/20px var(--body);color:var(--text-secondary)}
.unote .ic{width:16px;height:16px;flex:none;margin-top:2px}
.item{display:flex;flex-direction:column;gap:8px}
.sel{position:relative;display:block}
.sel select{width:100%;height:44px;padding:0 36px 0 12px;border:0;border-radius:12px;background:var(--surface-sunken);font:400 16px/24px var(--body);color:var(--text-primary);-webkit-appearance:none;appearance:none}
.sel .ic{position:absolute;right:12px;top:14px;width:16px;height:16px;pointer-events:none}
.irow{display:flex;align-items:center;gap:8px}
.chip.addl{align-self:flex-start;height:36px;color:var(--text-primary)}
.conn{margin-top:24px}
.conn p,.collab p{margin:0;font:400 13px/20px var(--body);color:var(--text-secondary)}
.conn .btn{align-self:flex-start}
.glink{display:flex;gap:8px}
.found{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;border:1px solid var(--border-default)}
.found .t{display:flex;flex-direction:column;align-items:flex-start}
.found b{font:500 14px/20px var(--body)}
.found .lnk .ic{width:12px;height:12px}
.cchip{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 4px;border-radius:999px;background:var(--surface-sunken);font:400 13px/16px var(--body);color:var(--text-secondary)}
.cchip b{font:500 14px/20px var(--body);color:var(--text-primary)}
.usbody{padding:8px 24px 24px;display:flex;flex-direction:column;gap:8px}
.usbody h2{margin:0;font:500 20px/24px var(--body)}
.usbody p{margin:0;font:400 14px/20px var(--body);color:var(--text-secondary)}
.us-act{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.us-act .btn{width:100%;height:44px}
/* Your post is live. (15.11) above the bottom bar */
.live{position:absolute;left:16px;right:16px;bottom:76px;z-index:30;border-radius:16px;background:var(--surface-raised);box-shadow:0 0 0 1px var(--border-default),0 12px 32px rgba(0,0,0,.16)}
.lv-top{display:flex;align-items:flex-start;gap:12px;padding:12px 12px 8px}
.lv-top .t{flex:1;min-width:0;display:flex;flex-direction:column}
.lv-top b{font:500 16px/24px var(--body)}
.lv-top .t span{font:400 13px/16px var(--body);color:var(--text-secondary)}
.lv-top .pts{color:var(--status-success-text)}
.lv-top .xb{width:32px;height:32px;border:0}
.lv-share{display:flex;gap:8px;padding:0 12px 12px}
.lv-share .btn{flex:1;gap:8px}
.lv-share .btn .ic{width:16px;height:16px}
.lv-act{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-top:1px solid var(--border-default)}

/* M13 · notifications */
.n-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 8px}
.cnt-a{color:var(--text-accent)}
.n-mark{border:0;background:transparent;padding:0 4px;height:32px;font:500 14px/20px var(--body)}
.ulab3{margin:16px 0 4px;font:400 13px/16px var(--body);color:var(--text-secondary)}
.nlist{list-style:none;margin:0;padding:0}
.nrow{position:relative;display:flex;align-items:flex-start;gap:12px;padding:12px 0 12px 12px}
.n-dot{position:absolute;left:0;top:28px;width:8px;height:8px;border-radius:999px;background:var(--action-accent)}
.n-av{position:relative;flex:none;width:40px;height:40px}
.n-b{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:999px;background:var(--surface-raised);box-shadow:0 0 0 2px var(--surface-page);display:grid;place-items:center;color:var(--text-primary)}
.n-b .ic{width:12px;height:12px}
.n-b.red{color:var(--status-danger)}
.n-ic{flex:none;width:40px;height:40px;border-radius:999px;background:var(--surface-sunken);display:grid;place-items:center}
.n-ic .ic{width:20px;height:20px}
.n-ic.ok{color:var(--status-success)}
.n-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.n-link{font:400 14px/20px var(--body);text-decoration:none;color:var(--text-primary)}
.n-link b{font-weight:500}
.n-time{font:400 13px/16px var(--body);color:var(--text-secondary)}
.n-act{display:flex;gap:8px;margin-top:4px}
.btn.s32{height:32px;padding:0 16px;font:500 14px/20px var(--body)}
.n-th{flex:none;width:44px;height:44px;border-radius:8px}
.n-empty{min-height:360px}
.n-empty .ic{width:24px;height:24px;color:var(--text-secondary);margin-bottom:8px}

/* M14 · access */
.atop{border-bottom:0}
.mmain.auth{padding:8px 24px 32px;display:flex;flex-direction:column;align-items:stretch;gap:12px}
.wmark{align-self:center;display:block;width:50px;height:32px;margin-top:16px;color:var(--text-primary)}
.brand{display:block;flex:none}
.brand-w{width:50px;height:32px;fill:currentColor}
.brand-g{width:20px;height:20px}
.brand-d{width:22px;height:17px}
.ah{margin:4px 0 0;text-align:center;font:500 20px/24px var(--body)}
.asub{margin:-4px 0 4px;text-align:center;font:400 14px/20px var(--body);color:var(--text-secondary)}
.asub b{font-weight:500;color:var(--text-primary)}
.asoc{display:flex;flex-direction:column;gap:8px}
.btn.abtn{width:100%;height:48px;gap:12px;font:500 16px/24px var(--body)}
.btn.abtn{position:relative}
.btn.abtn .brand{position:absolute;left:16px}
.btn.primary.abtn .brand-d path{fill:currentColor}
.aor{display:flex;align-items:center;gap:12px;font:400 13px/16px var(--body);color:var(--text-secondary)}
.aor::before,.aor::after{content:"";flex:1;height:1px;background:var(--border-default)}
.afield{position:relative;display:flex;align-items:center}
.afield .uin{height:48px}
.afield.bad .uin{box-shadow:inset 0 0 0 1px var(--status-danger)}
.afield .eye{position:absolute;right:4px;width:40px;height:40px;padding:0;border:0;border-radius:999px;background:transparent;display:grid;place-items:center;color:var(--text-secondary)}
.afield .eye .ic{width:20px;height:20px}
.afield input[type="password"],.afield #spw,.afield #lpw,.afield #npw{padding-right:48px}
.afield.at > span{position:absolute;left:12px;color:var(--text-secondary);font:400 16px/24px var(--body)}
.afield.at .uin{padding-left:32px}
.ferr{margin:-4px 0 0;font:400 13px/20px var(--body);color:var(--status-danger)}
.ferr.ac,.alink.ac{text-align:center;align-self:center}
.ahint{margin:-4px 0 0;font:400 13px/20px var(--body);color:var(--text-secondary)}
.aright{display:flex;justify-content:flex-end;margin-top:-4px}
.alink{border:0;background:transparent;padding:0;min-height:24px;font:400 13px/20px var(--body);color:var(--text-secondary);text-decoration:underline;text-underline-offset:2px}
.alink.in{display:inline;min-height:0}
.afine{margin:0;text-align:center;font:400 13px/20px var(--body);color:var(--text-secondary)}
.afine a{color:inherit}
.afine.bal{text-wrap:balance}
.afoot{margin:0;text-align:center;font:400 13px/20px var(--body);color:var(--text-secondary)}
.aerr{display:flex;align-items:flex-start;gap:8px;padding:12px;border-radius:12px;background:var(--tint-danger);color:var(--text-danger);font:400 14px/20px var(--body)}
.aerr .ic{width:16px;height:16px;flex:none;margin-top:2px}
.aerr.ok{background:var(--tint-success);color:var(--status-success-text)}
.otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.otpb{width:100%;height:52px;padding:0;border:0;border-radius:12px;background:var(--surface-sunken);text-align:center;font:500 20px/24px var(--body);color:var(--text-primary);outline:none}
.otpb:focus{box-shadow:0 0 0 2px var(--focus-ring)}
.otp.bad .otpb{box-shadow:inset 0 0 0 1px var(--status-danger)}
.btn[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.bday{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px}
.bf{display:flex;flex-direction:column;gap:4px;min-width:0}
.bf label{font:400 13px/16px var(--body);color:var(--text-secondary)}
.bf .uin{height:48px}
.bf.bad .uin{box-shadow:inset 0 0 0 1px var(--status-danger)}
.bf .sel select{height:48px}
.bf .sel .ic{top:16px}
.icats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.icats .chip{height:40px}
.taste{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.taste i{display:block;aspect-ratio:4/3;border-radius:8px}
.utog.acard{margin:0;padding:12px;border-radius:12px;border:1px solid var(--border-default)}
.su-pic{display:flex;align-items:center;gap:12px}
#setupS .fok{display:flex;align-items:center;gap:4px;margin:-4px 0 0}

/* M14 · welcome (mobile only) and pinned actions */
.atop.over{position:absolute;top:0;left:0;right:0;background:transparent}
.atop.over .ib{background:var(--overlay-on-media);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--text-on-media)}
.mmain.auth:has(.whero){padding:0;gap:0}
.whero{flex:1 1 auto;min-height:280px;display:grid;place-items:center}
.wwm{display:block;width:240px;color:var(--text-on-media)}
.wwm .brand{width:100%;height:auto}
.wpanel{flex:none;display:flex;flex-direction:column;gap:12px;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px))}
.btn.outlined.abtn > .ic{position:absolute;left:16px;width:20px;height:20px}
.apin{position:sticky;bottom:0;z-index:5;margin:auto -24px -32px;padding:12px 24px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;background:var(--surface-page)}

/* bottom bar: five tabs */
.mbar{position:sticky;bottom:0;z-index:20;flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));background:var(--surface-page);border-top:1px solid var(--border-default)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;padding:0;border:0;background:transparent;text-decoration:none;color:var(--text-secondary);border-radius:12px}
.tab .pill{width:56px;height:32px;border-radius:999px;display:grid;place-items:center}
.tab .ic{width:24px;height:24px}
.tab span.l{font:500 13px/16px var(--body);white-space:nowrap}
.tab:hover .pill{background:var(--overlay-on-surface)}
.tab[aria-current="page"]{color:var(--text-primary)}
.tab[aria-current="page"] .pill{background:var(--surface-sunken)}
.tab.up .pill{width:40px;background:var(--action-primary);color:var(--text-on-ink)}
.tab.up .pill .ic{width:20px;height:20px}
.tab.up:hover .pill{box-shadow:inset 0 0 0 999px var(--overlay-on-primary)}
.av{width:24px;height:24px;border-radius:999px;flex:none;background:radial-gradient(circle at 50% 38%,#f3d2b8 0 22%,transparent 23%),radial-gradient(ellipse at 50% 100%,#3a2f5c 0 46%,transparent 47%),linear-gradient(135deg,#8f7ae8,#e8926f)}
.tab[aria-current="page"] .av{box-shadow:0 0 0 2px var(--surface-page),0 0 0 4px var(--text-primary)}

/* the More sheet */
.scrim{position:absolute;inset:0;z-index:40;background:var(--overlay-scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - 48px);overflow-y:auto;overscroll-behavior:contain;border-radius:24px 24px 0 0;background:var(--surface-raised);box-shadow:0 -12px 32px rgba(0,0,0,.16);padding-bottom:env(safe-area-inset-bottom,0px)}
.grab{width:32px;height:4px;border-radius:999px;background:var(--border-strong);margin:8px auto 0}
.shd{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 16px 8px 24px}
.shd h2{margin:0;font:500 20px/24px var(--body)}
.xb{width:40px;height:40px;padding:0;border-radius:999px;border:1px solid var(--border-strong);background:transparent;display:grid;place-items:center}
.xb .ic{width:20px;height:20px}
.xb:hover{background:var(--overlay-on-surface)}
.slist{list-style:none;margin:0;padding:0 8px}
.srow{width:100%;height:48px;display:flex;align-items:center;gap:16px;padding:0 16px;border:0;border-radius:12px;background:transparent;text-decoration:none;color:var(--text-primary);font:400 16px/24px var(--body);text-align:left}
.srow:hover{background:var(--overlay-on-surface)}
.srow .ic{width:20px;height:20px}
.srow .coin{width:20px;height:20px}
.srow .trail{margin-left:auto;font:400 14px/20px var(--body);color:var(--text-secondary);font-variant-numeric:tabular-nums;white-space:nowrap}
.sdiv{height:1px;margin:8px 24px;background:var(--border-default)}
.sfoot{margin-top:8px;border-top:1px solid var(--border-default)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 24px}
.cols h3{margin:0 0 4px;font:400 13px/16px var(--body);color:var(--text-secondary)}
.cols ul{list-style:none;margin:0;padding:0}
.cols a{display:inline-flex;align-items:center;gap:4px;min-height:40px;font:400 16px/24px var(--body);text-decoration:none}
.cols a .ic{width:16px;height:16px}
.cols a:hover{text-decoration:underline}
.legal{border-top:1px solid var(--border-default);padding:16px 24px 24px;display:flex;flex-direction:column;gap:16px}
.legal ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0 16px}
.legal li a{display:inline-flex;align-items:center;min-height:32px;font:400 14px/20px var(--body);color:var(--text-secondary);text-decoration:none}
.legal li a:hover{color:var(--text-primary);text-decoration:underline}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:16px}
.soc{display:flex;gap:4px;margin-left:-8px}
.soc a{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--text-primary)}
.soc a .ic{width:20px;height:20px}
.soc a:hover{background:var(--overlay-on-surface)}
.theme{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface-sunken)}
.theme button{width:32px;height:32px;padding:0;border:0;border-radius:999px;background:transparent;display:grid;place-items:center;color:var(--text-secondary)}
.theme button .ic{width:20px;height:20px}
.theme button[aria-pressed="true"]{background:var(--surface-raised);color:var(--text-primary);box-shadow:0 0 0 1px var(--border-default)}
.copy{margin:0;font:400 14px/20px var(--body);color:var(--text-secondary)}

/* M7 · applied filters (7.4): page filters as removable chips, account settings dashed */
.applied{display:flex;gap:8px;align-items:center;margin:0 -16px 16px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.applied::-webkit-scrollbar{display:none}
.ach{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface-sunken);display:inline-flex;align-items:center;gap:8px;font:400 13px/16px var(--body);white-space:nowrap;color:var(--text-primary)}
.ach .ic{width:16px;height:16px}
.ach.acct{background:transparent;border-style:dashed;color:var(--text-secondary)}
.chg,.clear{flex:none;height:32px;padding:0 4px;border:0;background:transparent;font:500 13px/16px var(--body);color:var(--text-primary);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.chg{height:24px;margin-right:-4px}
/* M7 · first session (7.3): the topics note sits at the top of column 2 */
.topics{border-radius:16px;background:var(--surface-sunken);padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px}
.tp-hd{display:flex;align-items:center;justify-content:space-between;margin-right:-8px}
.eyebrow{font:400 13px/16px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--text-secondary)}
.tp-x{width:32px;height:32px;padding:0;border:0;border-radius:999px;background:transparent;display:grid;place-items:center;color:var(--text-secondary)}
.tp-x .ic{width:16px;height:16px}
.topics p{margin:0;font:500 14px/20px var(--body)}
.tp-ch{display:flex;flex-wrap:wrap;gap:8px}
.tp-ch span{height:28px;padding:0 8px;border-radius:999px;background:var(--surface-sunken);display:inline-flex;align-items:center;font:400 13px/16px var(--body)}
.tp-ch-l{align-self:flex-start;font:500 14px/20px var(--body);text-decoration:underline;text-underline-offset:2px;min-height:24px}
/* M7 · content warning (Warn): blurred art with the label and Show */
.th.cw > .cw-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px;text-align:center;color:var(--text-on-media);background:var(--overlay-on-media);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.cw-in b{font:500 14px/20px var(--body)} .cw-in span{font:400 13px/16px var(--body)}
.cw-show{margin-top:8px;height:32px;padding:0 16px;border-radius:999px;border:1px solid var(--text-on-media);background:transparent;color:var(--text-on-media);font:500 13px/16px var(--body)}
/* M7 · Collections for you (7.6) as a shelf that scrolls sideways */
.shelf{margin:24px -16px;display:flex;flex-direction:column;gap:12px}
.sh-hd{display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.sh-hd h2{margin:0;font:500 20px/24px var(--body)}
.see{font:500 14px/20px var(--body);color:var(--text-accent);text-decoration:none;min-height:24px;display:inline-flex;align-items:center}
.sh-row{list-style:none;margin:0;padding:0 16px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none}
.sh-row::-webkit-scrollbar{display:none}
.coll{flex:none;width:280px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start}
.cv{position:relative;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:4px;aspect-ratio:3/2;border-radius:12px;overflow:hidden}
.cv i:first-child{grid-row:1 / 3}
.cv i{display:block}
.cnt{position:absolute;top:8px;right:8px;height:24px;padding:0 8px;border-radius:999px;background:var(--overlay-on-media);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--text-on-media);display:inline-flex;align-items:center;gap:4px;font:500 13px/16px var(--body)}
.cnt .ic{width:16px;height:16px}

.flab{font:400 13px/16px var(--body);color:var(--text-secondary)}
